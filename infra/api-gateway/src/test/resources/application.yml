spring:
  application:
    name: api-gateway
  cloud:
    config:
      enabled: false
    gateway:
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowed-origins:
              - http://localhost:3000
            allowed-methods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowed-headers:
              - '*'
            allow-credentials: true
            max-age: 3600
      routes:
        - id: test-products
          uri: forward:/test-backend
          predicates:
            - Path=/api/products/**
        - id: test-categories
          uri: forward:/test-backend
          predicates:
            - Path=/api/categories/**
        - id: test-inventory
          uri: forward:/test-backend
          predicates:
            - Path=/api/inventory/**
        - id: test-orders
          uri: forward:/test-backend
          predicates:
            - Path=/api/orders/**


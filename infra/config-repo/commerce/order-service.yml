server:
  port: 0

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/order_db
    username: dbuser
    password: 12345
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
  sql:
    init:
      mode: never

feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000
      product-service:
        loggerLevel: basic
      inventory-service:
        connectTimeout: 2000
        readTimeout: 3000

logging:
  level:
    ru.yandex.practicum.order.client.ProductClient: DEBUG
